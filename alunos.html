<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos & Pagamentos - Painel Integrado</title>

    <!-- 🌙 FAVICON GÓTICO -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">

    <!-- Script para lembrar e voltar à última página aberta ao reabrir o site -->
    <script>
        (function() {
            const currentPath = window.location.pathname.split('/').pop() || 'alunos.html';
            localStorage.setItem('lastActivePage', currentPath);
        })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🌸 GOOGLE FONT: Cinzel Decorative -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
        .font-title {
            font-family: 'Cinzel Decorative', serif;
        }
        body {
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            background-color: #1A1A1A !important;
            color: #D8B4D9;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
    </style>
</head>
<body style="background-color: #1A1A1A;" class="min-h-screen flex flex-col">

    <!-- Header -->
    <header style="background-color: #502064;" class="text-white shadow-md border-b border-[#6B3A7E]">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-3xl sm:text-4xl font-title tracking-wide text-[#F48FB1] flex items-center gap-2">
                Gestão de Alunos
            </h1>
            <div id="sync-status" class="text-xs bg-[#6B0F1A] text-[#D8B4D9] px-3 py-1 rounded-full mt-2 sm:mt-0 flex items-center gap-1 border border-[#F48FB1]/30">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Sincronizado na Nuvem</span>
            </div>
        </div>

        <!-- ABAS DE NAVEGAÇÃO DINÂMICAS AUTOMÁTICAS -->
        <div id="nav-tabs-container" class="max-w-6xl mx-auto px-4 flex flex-wrap gap-2 sm:gap-4 border-b border-[#6B3A7E] py-2">
            <!-- Renderizado dinamicamente pelo nav.js -->
        </div>
    </header>

    <!-- Main Container: Alunos & Pagamentos -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Métricas Financeiras -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div style="background-color: #262626;" class="p-4 rounded-xl border border-[#6B3A7E]">
                <span class="text-xs text-[#D8B4D9]/75">Total Previsto no Período</span>
                <p id="stat-total" class="text-2xl font-bold text-[#F48FB1] mt-1">R$ 0,00</p>
            </div>
            <div style="background-color: #262626;" class="p-4 rounded-xl border border-[#6B3A7E]">
                <span class="text-xs text-[#F48FB1]">Total Recebido</span>
                <p id="stat-pago" class="text-2xl font-bold text-[#F48FB1] mt-1">R$ 0,00</p>
            </div>
            <div style="background-color: #262626;" class="p-4 rounded-xl border border-[#6B3A7E]">
                <span class="text-xs text-[#D8B4D9]">A Receber / Pendente</span>
                <p id="stat-pendente" class="text-2xl font-bold text-[#D8B4D9] mt-1">R$ 0,00</p>
            </div>
            <div style="background-color: #262626;" class="p-4 rounded-xl border border-[#6B0F1A]">
                <span class="text-xs text-rose-300">Cobranças Atrasadas</span>
                <p id="stat-atrasado" class="text-2xl font-bold text-rose-400 mt-1">0 Alunos</p>
            </div>
        </div>

        <!-- Formulário de Aluno -->
        <div style="background-color: #262626;" class="p-5 rounded-xl shadow-lg border border-[#6B3A7E]/40 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-[#6B3A7E] pb-2 gap-2">
                <h2 id="aluno-form-title" class="text-xl sm:text-2xl font-title text-[#F48FB1] flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-base"></i> Registrar Aluno & Aulas
                </h2>
                <div class="flex items-center gap-3">
                    <a href="chamada.html" style="background-color: #6B0F1A;" class="text-xs text-white px-3 py-1.5 rounded-lg border border-[#F48FB1]/30 hover:bg-[#801320] transition flex items-center gap-1">
                        <i class="fa-solid fa-clipboard-user"></i> Ir para Controle de Chamada 📋
                    </a>
                    <button id="cancel-aluno-btn" onclick="cancelAlunoEdit()" class="hidden text-xs text-rose-400 hover:underline">Cancelar Edição</button>
                </div>
            </div>

            <form id="aluno-form" class="space-y-4">
                <input type="hidden" id="aluno-editing-id" value="">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <div>
                        <label class="text-xs text-[#D8B4D9]/80 mb-1 block">Nome do Aluno(a)</label>
                        <input type="text" id="aluno-nome" placeholder="ex: Ana Silva" required class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                    </div>

                    <div>
                        <label class="text-xs text-[#D8B4D9]/80 mb-1 block">Valor por Hora (R$)</label>
                        <input type="text" id="aluno-valor-hora" placeholder="R$ 0,00" oninput="formatCurrencyInput(this); calculateTotalAluno();" required class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                    </div>

                    <div>
                        <label class="text-xs text-[#D8B4D9]/80 mb-1 block">Horas / Sessões</label>
                        <input type="number" min="1" id="aluno-horas" placeholder="ex: 4" oninput="calculateTotalAluno()" required class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                    </div>

                    <div>
                        <label class="text-xs text-[#F48FB1] font-semibold mb-1 block">Total Calculado (R$)</label>
                        <input type="text" id="aluno-total-display" readonly value="R$ 0,00" class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-[#F48FB1] font-bold rounded-lg focus:outline-none cursor-not-allowed">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <div>
                        <label class="text-xs text-[#D8B4D9]/80 mb-1 block">Data de Vencimento</label>
                        <input type="date" id="aluno-vencimento-date" required class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                    </div>

                    <div>
                        <label class="text-xs text-[#D8B4D9]/80 mb-1 block">Método de Pagamento</label>
                        <select id="aluno-metodo" class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                            <option value="Pix">Pix</option>
                            <option value="Dinheiro">Dinheiro</option>
                            <option value="Cartão">Cartão</option>
                            <option value="Transferência">Transferência</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-xs text-[#D8B4D9]/80 mb-1 block">Status do Pagamento</label>
                        <select id="aluno-status" class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                            <option value="Pendente">🟡 Pendente</option>
                            <option value="Pago">🟢 Pago</option>
                            <option value="Atrasado">🔴 Atrasado</option>
                        </select>
                    </div>

                    <div>
                        <label class="text-xs text-[#D8B4D9]/80 mb-1 block">Data do Pagamento (se pago)</label>
                        <input type="date" id="aluno-pagamento-date" class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                    </div>
                </div>

                <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
                    <input type="text" id="aluno-notes" placeholder="Observações (ex: repor aula no dia 12)" class="w-full sm:flex-grow px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">

                    <button type="submit" id="aluno-submit-btn" style="background-color: #6B0F1A;" class="w-full sm:w-auto hover:bg-[#801320] text-white px-8 py-2 rounded-lg font-medium transition border border-[#F48FB1]/30 whitespace-nowrap">
                        Salvar Aluno
                    </button>
                </div>
            </form>
        </div>

        <!-- Filtros de Alunos & Range de Datas -->
        <div class="flex flex-col lg:flex-row justify-between items-center gap-3 bg-[#262626] p-4 rounded-xl border border-[#6B3A7E]/40">
            <span class="text-[#F48FB1] font-title text-xl sm:text-2xl flex items-center gap-2">
                <i class="fa-solid fa-users text-sm"></i> Lista de Alunos
            </span>
            
            <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto justify-end">
                <div class="flex items-center gap-1.5 text-xs">
                    <span class="text-[#D8B4D9]">De:</span>
                    <input type="date" id="filter-start-date" onchange="renderAlunosList()" class="px-2 py-1.5 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none">
                    <span class="text-[#D8B4D9]">Até:</span>
                    <input type="date" id="filter-end-date" onchange="renderAlunosList()" class="px-2 py-1.5 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none">
                    <button onclick="clearDateFilter()" title="Limpar Filtro" class="text-xs px-2 py-1.5 bg-[#6B0F1A] text-white rounded hover:bg-[#801320] transition"><i class="fa-solid fa-xmark"></i></button>
                </div>

                <div class="flex items-center gap-2">
                    <label class="text-xs text-[#D8B4D9]">Organizar:</label>
                    <select id="sort-alunos" onchange="renderAlunosList()" class="px-3 py-1.5 bg-[#1A1A1A] border border-[#6B3A7E] text-white text-xs rounded-lg focus:outline-none">
                        <option value="created">Data de Adição</option>
                        <option value="status">Status (Atrasado > Pendente > Pago)</option>
                        <option value="vencimento">Data de Vencimento</option>
                        <option value="pagamento">Data de Pagamento</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Alunos Ativos Grid -->
        <div id="alunos-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <p class="text-neutral-400 italic col-span-full">Carregando dados dos alunos...</p>
        </div>

        <!-- TAB RETRÁTIL DE ALUNOS ARQUIVADOS -->
        <div style="background-color: #262626;" class="rounded-xl shadow-lg border border-[#6B3A7E]/60 overflow-hidden mt-10">
            <button onclick="toggleArchivedAlunosSection()" class="w-full p-4 flex items-center justify-between text-left hover:bg-[#331c42] transition">
                <div class="flex items-center gap-2">
                    <span class="text-[#F48FB1] font-title text-xl sm:text-2xl"><i class="fa-solid fa-box-archive text-sm"></i> Alunos Arquivados</span>
                    <span id="archived-alunos-badge" class="text-xs bg-[#502064] text-[#D8B4D9] px-2 py-0.5 rounded-full border border-[#6B3A7E]">0</span>
                </div>
                <i id="archived-alunos-toggle-icon" class="fa-solid fa-chevron-down text-[#F48FB1] transition-transform"></i>
            </button>
            <div id="archived-alunos-section-content" class="hidden p-4 border-t border-[#6B3A7E]/50 space-y-4">
                <div id="archived-alunos-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <p class="text-neutral-400 italic text-xs">Nenhum aluno arquivado.</p>
                </div>
            </div>
        </div>

    </main>

    <!-- Script da Navegação Dinâmica -->
    <script src="nav.js"></script>

    <!-- Firebase SDKs via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk3kW6ae9nceSgvRWJrfm5ka_Kbjor0mk",
            authDomain: "painelpessoal-ab165.firebaseapp.com",
            projectId: "painelpessoal-ab165",
            storageBucket: "painelpessoal-ab165.firebasestorage.app",
            messagingSenderId: "113043267624",
            appId: "1:113043267624:web:b2d40daac28c3a55a4951d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('aluno-vencimento-date').value = todayStr;

        let alunosDataCache = [];

        window.formatCurrencyInput = function(input) {
            let value = input.value.replace(/\D/g, '');
            if (!value) {
                input.value = '';
                return;
            }
            let number = (parseFloat(value) / 100).toFixed(2);
            input.value = `R$ ${number.replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.')}`;
        }

        window.calculateTotalAluno = function() {
            const rawVal = document.getElementById('aluno-valor-hora').value;
            const cleanVal = rawVal.replace('R$', '').replace(/\./g, '').replace(',', '.').trim();
            const vHora = parseFloat(cleanVal) || 0;
            const horas = parseFloat(document.getElementById('aluno-horas').value) || 0;
            const total = vHora * horas;
            document.getElementById('aluno-total-display').value = `R$ ${total.toFixed(2).replace('.', ',')}`;
        }

        const alunoForm = document.getElementById('aluno-form');
        alunoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('aluno-nome').value;
            
            const rawVal = document.getElementById('aluno-valor-hora').value;
            const cleanVal = rawVal.replace('R$', '').replace(/\./g, '').replace(',', '.').trim();
            const valorHora = parseFloat(cleanVal) || 0;
            
            const horas = parseFloat(document.getElementById('aluno-horas').value) || 0;
            const totalValor = valorHora * horas;

            const vencimentoDate = document.getElementById('aluno-vencimento-date').value;
            const metodo = document.getElementById('aluno-metodo').value;
            const status = document.getElementById('aluno-status').value;
            const pagamentoDate = document.getElementById('aluno-pagamento-date').value || '';
            const notes = document.getElementById('aluno-notes').value;
            const editId = document.getElementById('aluno-editing-id').value;

            try {
                if (editId) {
                    await updateDoc(doc(db, "alunos", editId), { 
                        nome, valorHora, horas, totalValor, vencimentoDate, metodo, status, pagamentoDate, notes 
                    });
                    cancelAlunoEdit();
                } else {
                    await addDoc(collection(db, "alunos"), { 
                        nome, valorHora, horas, totalValor, vencimentoDate, metodo, status, pagamentoDate, notes, 
                        createdAt: Date.now(),
                        createdDate: todayStr,
                        archived: false
                    });
                    alunoForm.reset();
                    document.getElementById('aluno-vencimento-date').value = todayStr;
                    calculateTotalAluno();
                }
            } catch (err) { console.error("Erro ao salvar aluno:", err); }
        });

        window.startEditAluno = function(id, nome, valorHora, horas, vencimentoDate, metodo, status, pagamentoDate, notes) {
            document.getElementById('aluno-editing-id').value = id;
            document.getElementById('aluno-nome').value = nome || '';
            
            const vH = valorHora || 0;
            document.getElementById('aluno-valor-hora').value = `R$ ${vH.toFixed(2).replace('.', ',')}`;
            document.getElementById('aluno-horas').value = horas || 0;
            document.getElementById('aluno-vencimento-date').value = vencimentoDate || todayStr;
            document.getElementById('aluno-metodo').value = metodo || 'Pix';
            document.getElementById('aluno-status').value = status || 'Pendente';
            document.getElementById('aluno-pagamento-date').value = pagamentoDate || '';
            document.getElementById('aluno-notes').value = notes || '';

            calculateTotalAluno();

            document.getElementById('aluno-form-title').innerHTML = `<i class="fa-solid fa-user-pen text-base"></i> Editar Aluno`;
            document.getElementById('aluno-submit-btn').innerText = "Atualizar Aluno";
            document.getElementById('cancel-aluno-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelAlunoEdit = function() {
            document.getElementById('aluno-editing-id').value = "";
            alunoForm.reset();
            document.getElementById('aluno-vencimento-date').value = todayStr;
            calculateTotalAluno();
            document.getElementById('aluno-form-title').innerHTML = `<i class="fa-solid fa-user-plus text-base"></i> Registrar Aluno & Aulas`;
            document.getElementById('aluno-submit-btn').innerText = "Salvar Aluno";
            document.getElementById('cancel-aluno-btn').classList.add('hidden');
        }

        window.toggleStatusAluno = async function(id, currentStatus) {
            const nextStatus = currentStatus === 'Pago' ? 'Pendente' : 'Pago';
            const payDate = nextStatus === 'Pago' ? todayStr : '';
            await updateDoc(doc(db, "alunos", id), { status: nextStatus, pagamentoDate: payDate });
        }

        window.toggleArchiveAluno = async function(id, currentArchivedState) {
            await updateDoc(doc(db, "alunos", id), { archived: !currentArchivedState });
        }

        window.toggleCardCollapse = function(cardId) {
            const bodyEl = document.getElementById(`card-body-${cardId}`);
            const iconEl = document.getElementById(`card-icon-${cardId}`);
            if (bodyEl && iconEl) {
                if (bodyEl.style.display === 'none') {
                    bodyEl.style.display = 'block';
                    iconEl.classList.remove('rotate-180');
                } else {
                    bodyEl.style.display = 'none';
                    iconEl.classList.add('rotate-180');
                }
            }
        };

        window.toggleArchivedAlunosSection = function() {
            const content = document.getElementById('archived-alunos-section-content');
            const icon = document.getElementById('archived-alunos-toggle-icon');
            content.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        };

        window.clearDateFilter = function() {
            document.getElementById('filter-start-date').value = '';
            document.getElementById('filter-end-date').value = '';
            renderAlunosList();
        }

        window.deleteAluno = async function(id) { await deleteDoc(doc(db, "alunos", id)); }

        function formatDateDisplay(val) {
            if (!val) return '';
            if (typeof val === 'number') {
                return new Date(val).toLocaleDateString('pt-BR');
            }
            if (typeof val === 'string' && val.includes('-')) {
                const parts = val.split('-');
                if (parts.length === 3) {
                    return `${parts[2]}/${parts[1]}/${parts[0]}`;
                }
            }
            return String(val);
        }

        onSnapshot(query(collection(db, "alunos")), (snapshot) => {
            alunosDataCache = [];
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                
                const valTotal = data.totalValor || data.valor || 0;
                const vHora = data.valorHora || (data.valor ? data.valor / (data.horas || 1) : 0);
                const hrs = data.horas || 1;

                alunosDataCache.push({ 
                    id, 
                    ...data,
                    totalValor: valTotal,
                    valorHora: vHora,
                    horas: hrs
                });
            });

            renderAlunosList();
        });

        window.renderAlunosList = function() {
            const grid = document.getElementById('alunos-grid');
            const archivedGrid = document.getElementById('archived-alunos-grid');
            const archivedBadge = document.getElementById('archived-alunos-badge');
            const sortBy = document.getElementById('sort-alunos').value;

            const startDate = document.getElementById('filter-start-date').value;
            const endDate = document.getElementById('filter-end-date').value;

            grid.innerHTML = '';
            archivedGrid.innerHTML = '';

            let totalPrevisto = 0;
            let totalPago = 0;
            let totalPendente = 0;
            let countAtrasado = 0;
            let activeCount = 0;
            let archivedCount = 0;

            if (alunosDataCache.length === 0) {
                grid.innerHTML = `<p class="text-neutral-400 italic col-span-full">Nenhum aluno cadastrado ainda.</p>`;
                archivedGrid.innerHTML = `<p class="text-neutral-400 italic text-xs col-span-full">Nenhum aluno arquivado.</p>`;
                document.getElementById('stat-total').innerText = 'R$ 0,00';
                document.getElementById('stat-pago').innerText = 'R$ 0,00';
                document.getElementById('stat-pendente').innerText = 'R$ 0,00';
                document.getElementById('stat-atrasado').innerText = '0 Aluno(s)';
                archivedBadge.innerText = '0';
                return;
            }

            const sorted = [...alunosDataCache].sort((a, b) => {
                if (sortBy === 'status') {
                    const order = { 'Atrasado': 1, 'Pendente': 2, 'Pago': 3 };
                    return (order[a.status] || 99) - (order[b.status] || 99);
                } else if (sortBy === 'vencimento') {
                    return String(a.vencimentoDate || a.vencimento || '').localeCompare(String(b.vencimentoDate || b.vencimento || ''));
                } else if (sortBy === 'pagamento') {
                    return String(b.pagamentoDate || '').localeCompare(String(a.pagamentoDate || ''));
                } else {
                    return (b.createdAt || 0) - (a.createdAt || 0);
                }
            });

            sorted.forEach((data) => {
                const id = data.id;
                const isArchived = data.archived || false;
                const statusVal = data.status || 'Pendente';
                const vHora = data.valorHora || 0;
                const sessoesCount = data.horas || 1;

                let effectiveVal = data.totalValor;
                let isInRange = true;

                if (startDate && endDate) {
                    const venc = data.vencimentoDate || data.vencimento || '';
                    let matchedAulas = 0;
                    if (data.aulasPresenca && Array.isArray(data.aulasPresenca)) {
                        data.aulasPresenca.forEach(a => {
                            if (a.dataAula && a.dataAula >= startDate && a.dataAula <= endDate) {
                                matchedAulas++;
                            }
                        });
                    }

                    const vencInRange = (venc >= startDate && venc <= endDate);

                    if (matchedAulas > 0) {
                        effectiveVal = vHora * matchedAulas;
                        isInRange = true;
                    } else if (vencInRange) {
                        effectiveVal = data.totalValor;
                        isInRange = true;
                    } else {
                        isInRange = false;
                    }
                }

                if (!isArchived && isInRange) {
                    totalPrevisto += effectiveVal;
                    if (statusVal === 'Pago') totalPago += effectiveVal;
                    else if (statusVal === 'Pendente') totalPendente += effectiveVal;
                    else if (statusVal === 'Atrasado') {
                        totalPendente += effectiveVal;
                        countAtrasado++;
                    }
                }

                const badgeStatus = statusVal === 'Pago' ? 'bg-[#502064] text-[#F48FB1] border-[#6B3A7E]' :
                                    statusVal === 'Atrasado' ? 'bg-[#6B0F1A] text-rose-200 border-rose-800 animate-pulse' : 'bg-[#33131A] text-[#D8B4D9] border-[#6B3A7E]';

                const safeNome = (data.nome || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                const safeNotes = (data.notes || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');

                const vencimentoTxt = formatDateDisplay(data.vencimentoDate || data.vencimento);
                const rawPagamento = data.pagamentoDate || (statusVal === 'Pago' ? (data.createdDate || todayStr) : '');
                const pagamentoTxt = formatDateDisplay(rawPagamento);
                const criadoTxt = formatDateDisplay(data.createdDate || data.createdAt);
                const observacaoTxt = data.notes || '';

                const card = document.createElement('div');
                card.className = `p-4 rounded-xl shadow-lg border self-start ${isArchived ? 'border-[#502064]/40 opacity-75' : 'border-[#502064]'}`;
                card.style.backgroundColor = isArchived ? "#221926" : "#262626";

                let pagamentoHtml = '';
                if (pagamentoTxt) {
                    pagamentoHtml = `<div class="flex justify-between text-emerald-400"><span>Pago em:</span><span>${pagamentoTxt}</span></div>`;
                }

                let observacaoHtml = '';
                if (observacaoTxt) {
                    observacaoHtml = `<p class="text-xs text-[#D8B4D9]/80 italic mt-2 bg-[#1A1A1A] p-2 rounded border border-[#6B3A7E]/30">${observacaoTxt}</p>`;
                }

                card.innerHTML = `
                    <div>
                        <!-- CABEÇALHO DO CARD (Sempre visível) -->
                        <div class="flex justify-between items-start border-b border-[#6B3A7E]/50 pb-2 mb-3">
                            <div class="flex items-center gap-2">
                                <button onclick="toggleCardCollapse('${id}')" class="text-[#F48FB1] hover:text-white transition">
                                    <i id="card-icon-${id}" class="fa-solid fa-chevron-down transition-transform"></i>
                                </button>
                                <h3 class="font-title text-2xl sm:text-3xl text-[#F48FB1]">${data.nome || 'Sem Nome'}</h3>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs px-2 py-0.5 rounded border ${badgeStatus}">${statusVal}</span>
                                <button onclick="toggleArchiveAluno('${id}', ${isArchived})" title="${isArchived ? 'Restaurar' : 'Arquivar'}" class="text-xs text-[#D8B4D9]/60 hover:text-[#F48FB1] transition">
                                    <i class="fa-solid ${isArchived ? 'fa-rotate-left' : 'fa-box-archive'}"></i>
                                </button>
                            </div>
                        </div>

                        <!-- CONTEÚDO COLAPSÁVEL DO CARD -->
                        <div id="card-body-${id}" style="display: block;">
                            <div class="text-xs space-y-1.5 text-[#D8B4D9]">
                                <div class="flex justify-between">
                                    <span class="text-neutral-400">Hora × Sessões:</span>
                                    <span>R$ ${vHora.toFixed(2).replace('.', ',')} × ${sessoesCount}h</span>
                                </div>
                                <div class="flex justify-between font-bold text-[#F48FB1] text-sm">
                                    <span>Total Mensal:</span>
                                    <span>R$ ${(data.totalValor || 0).toFixed(2).replace('.', ',')}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-neutral-400">Vencimento:</span>
                                    <span>${vencimentoTxt}</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-neutral-400">Método:</span>
                                    <span>${data.metodo || 'Pix'}</span>
                                </div>
                                ${pagamentoHtml}
                                <div class="flex justify-between text-[10px] text-neutral-500 pt-1">
                                    <span>Adicionado em:</span>
                                    <span>${criadoTxt}</span>
                                </div>
                                ${observacaoHtml}
                            </div>

                            <div class="mt-4 pt-3 border-t border-[#6B3A7E]/40 flex justify-between items-center">
                                <button onclick="toggleStatusAluno('${id}', '${statusVal}')" class="text-xs px-3 py-1.5 rounded font-medium ${statusVal === 'Pago' ? 'bg-[#502064] text-[#D8B4D9] hover:text-white' : 'bg-[#6B0F1A] text-white hover:bg-[#801320]'} transition border border-[#F48FB1]/30">
                                    ${statusVal === 'Pago' ? 'Marcar Pendente 🟡' : 'Confirmar Pago 🟢'}
                                </button>
                                <div class="flex gap-2 text-xs">
                                    <button onclick="startEditAluno('${id}', '${safeNome}', ${vHora}, ${sessoesCount}, '${data.vencimentoDate || ''}', '${data.metodo || 'Pix'}', '${statusVal}', '${data.pagamentoDate || ''}', '${safeNotes}')" class="text-neutral-500 hover:text-[#F48FB1]"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="deleteAluno('${id}')" class="text-neutral-500 hover:text-rose-400"><i class="fa-solid fa-trash"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                if (isArchived) {
                    archivedCount++;
                    archivedGrid.appendChild(card);
                } else {
                    activeCount++;
                    grid.appendChild(card);
                }
            });

            document.getElementById('stat-total').innerText = `R$ ${totalPrevisto.toFixed(2).replace('.', ',')}`;
            document.getElementById('stat-pago').innerText = `R$ ${totalPago.toFixed(2).replace('.', ',')}`;
            document.getElementById('stat-pendente').innerText = `R$ ${totalPendente.toFixed(2).replace('.', ',')}`;
            document.getElementById('stat-atrasado').innerText = `${countAtrasado} Aluno(s)`;
            archivedBadge.innerText = archivedCount;

            if (activeCount === 0) {
                grid.innerHTML = `<p class="text-neutral-400 italic col-span-full">Nenhum aluno ativo encontrado para o período selecionado.</p>`;
            }
            if (archivedCount === 0) {
                archivedGrid.innerHTML = `<p class="text-neutral-400 italic text-xs col-span-full">Nenhum aluno arquivado.</p>`;
            }
        }
    </script>
</body>
</html>
