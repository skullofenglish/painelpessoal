<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List & Painel Pessoal</title>

    <!-- 🌙 FAVICON GÓTICO -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">

    <!-- Script para lembrar e voltar à última página aberta ao reabrir o site -->
    <script>
        (function() {
            const lastPage = localStorage.getItem('lastActivePage');
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            if (lastPage && lastPage !== currentPath && lastPage !== '') {
                window.location.href = lastPage;
            }
        })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🌸 GOOGLE FONT: Cinzel Decorative -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
        .font-title {
            font-family: 'Cinzel Decorative', serif;
        }
        body {
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            background-color: #1A1A1A !important;
            color: #D8B4D9;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
    </style>
</head>
<body style="background-color: #1A1A1A;" class="min-h-screen flex flex-col">

    <!-- Header -->
    <header style="background-color: #502064;" class="text-white shadow-md border-b border-[#6B3A7E]">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-3xl sm:text-4xl font-title tracking-wide text-[#F48FB1] flex items-center gap-2">
                Meu Painel Integrado
            </h1>
            <div id="sync-status" class="text-xs bg-[#6B0F1A] text-[#D8B4D9] px-3 py-1 rounded-full mt-2 sm:mt-0 flex items-center gap-1 border border-[#F48FB1]/30">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Sincronizado na Nuvem</span>
            </div>
        </div>

        <!-- ABAS DE NAVEGAÇÃO DINÂMICAS AUTOMÁTICAS -->
        <div id="nav-tabs-container" class="max-w-6xl mx-auto px-4 flex flex-wrap gap-2 sm:gap-4 border-b border-[#6B3A7E] py-2">
            <!-- Renderizado dinamicamente pelo nav.js -->
        </div>
    </header>

    <!-- Main Container: To-Do List -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Formulário Adicionar Tarefa -->
        <div style="background-color: #262626;" class="p-5 rounded-xl shadow-lg border border-[#6B3A7E]/40 space-y-3">
            <div class="flex justify-between items-center">
                <h2 id="form-title" class="text-xl sm:text-2xl font-title text-[#F48FB1] flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-base"></i> Adicionar Nova Tarefa
                </h2>
                <button id="cancel-edit-btn" onclick="cancelEdit()" class="hidden text-xs text-rose-400 hover:underline">Cancelar Edição</button>
            </div>
            
            <form id="todo-form" class="flex flex-col gap-3">
                <input type="hidden" id="editing-id" value="">
                
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="text" id="todo-text" placeholder="O que precisa ser feito?" required class="flex-grow px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                    
                    <select id="todo-category" class="px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                        <option value="Pessoal">Pessoal</option>
                        <option value="CaZinha">CaZinha</option>
                        <option value="Aulas">Aulas</option>
                    </select>

                    <input type="date" id="todo-date" class="px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                </div>

                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between pt-1 gap-2">
                    <div class="flex items-center gap-4">
                        <label class="flex items-center gap-2 cursor-pointer text-sm text-rose-400 font-medium">
                            <input type="checkbox" id="todo-urgent" class="rounded bg-[#1A1A1A] border-rose-600 text-rose-600 focus:ring-rose-500">
                            <span>Urgente 🚨</span>
                        </label>

                        <label class="flex items-center gap-2 cursor-pointer text-sm text-[#F48FB1] font-medium">
                            <input type="checkbox" id="todo-tbc" onchange="toggleDateInput(this)" class="rounded bg-[#1A1A1A] border-[#6B3A7E] text-[#6B0F1A] focus:ring-[#F48FB1]">
                            <span>To Be Confirmed (sem data)</span>
                        </label>
                    </div>

                    <button type="submit" id="submit-btn" style="background-color: #6B0F1A;" class="hover:bg-[#801320] text-white px-6 py-2 rounded-lg font-medium transition border border-[#F48FB1]/30">
                        Adicionar Tarefa
                    </button>
                </div>
            </form>
        </div>

        <!-- SEÇÃO DE TAREFAS URGENTES -->
        <div style="background-color: #33131A;" class="rounded-xl shadow-lg border border-rose-900/60 overflow-hidden">
            <button onclick="toggleUrgentSection()" class="w-full p-4 flex items-center justify-between text-left hover:bg-rose-950/40 transition">
                <div class="flex items-center gap-2">
                    <span class="text-rose-400 font-title text-xl sm:text-2xl">🚨 Tarefas Urgentes</span>
                    <span id="urgent-badge" class="text-xs bg-rose-900 text-rose-200 px-2 py-0.5 rounded-full border border-rose-700">0</span>
                </div>
                <i id="urgent-toggle-icon" class="fa-solid fa-chevron-down text-rose-400 transition-transform"></i>
            </button>
            <div id="urgent-section-content" class="hidden p-4 border-t border-rose-900/40 space-y-2">
                <ul id="urgent-list" class="space-y-2"></ul>
            </div>
        </div>

        <!-- TAREFAS AGRUPADAS POR DATA -->
        <div id="todos-by-date-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <p class="text-neutral-400 italic col-span-full">Carregando tarefas...</p>
        </div>

    </main>

    <!-- Script da Navegação Dinâmica -->
    <script src="nav.js"></script>

    <!-- Firebase SDKs via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk3kW6ae9nceSgvRWJrfm5ka_Kbjor0mk",
            authDomain: "painelpessoal-ab165.firebaseapp.com",
            projectId: "painelpessoal-ab165",
            storageBucket: "painelpessoal-ab165.firebasestorage.app",
            messagingSenderId: "113043267624",
            appId: "1:113043267624:web:b2d40daac28c3a55a4951d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('todo-date').value = todayStr;

        window.toggleDateInput = function(checkbox) {
            const dateInput = document.getElementById('todo-date');
            if (checkbox.checked) {
                dateInput.value = '';
                dateInput.disabled = true;
                dateInput.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                dateInput.value = todayStr;
                dateInput.disabled = false;
                dateInput.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        window.toggleUrgentSection = function() {
            const content = document.getElementById('urgent-section-content');
            const icon = document.getElementById('urgent-toggle-icon');
            content.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        }

        const todoForm = document.getElementById('todo-form');
        let tbcItemsCache = [];

        todoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('todo-text').value;
            const category = document.getElementById('todo-category').value;
            const isTbc = document.getElementById('todo-tbc').checked;
            const dueDate = isTbc ? '' : document.getElementById('todo-date').value;
            const isUrgent = document.getElementById('todo-urgent').checked;
            const editId = document.getElementById('editing-id').value;

            try {
                if (editId) {
                    await updateDoc(doc(db, "todos", editId), { text, category, dueDate, isUrgent, isTbc });
                    cancelEdit();
                } else {
                    await addDoc(collection(db, "todos"), { 
                        text, category, dueDate, isUrgent, isTbc, completed: false, archived: false, createdAt: Date.now() 
                    });
                    todoForm.reset();
                    document.getElementById('todo-date').value = todayStr;
                    document.getElementById('todo-date').disabled = false;
                    document.getElementById('todo-date').classList.remove('opacity-50', 'cursor-not-allowed');
                    document.getElementById('todo-tbc').checked = false;
                }
            } catch (err) { console.error("Erro ao salvar tarefa:", err); }
        });

        window.startEditTodo = function(id, text, category, dueDate, isUrgent, isTbc) {
            document.getElementById('editing-id').value = id;
            document.getElementById('todo-text').value = text;
            document.getElementById('todo-category').value = category;
            document.getElementById('todo-urgent').checked = isUrgent;
            document.getElementById('todo-tbc').checked = isTbc || false;
            
            const dateInput = document.getElementById('todo-date');
            if (isTbc) {
                dateInput.value = '';
                dateInput.disabled = true;
                dateInput.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                dateInput.value = dueDate || todayStr;
                dateInput.disabled = false;
                dateInput.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen-to-square text-base"></i> Editar Tarefa`;
            document.getElementById('submit-btn').innerText = "Atualizar Tarefa";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelEdit = function() {
            document.getElementById('editing-id').value = "";
            todoForm.reset();
            document.getElementById('todo-date').value = todayStr;
            document.getElementById('todo-date').disabled = false;
            document.getElementById('todo-date').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('todo-tbc').checked = false;
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-list-check text-base"></i> Adicionar Nova Tarefa`;
            document.getElementById('submit-btn').innerText = "Adicionar Tarefa";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        function formatDateHeader(dateString) {
            if (!dateString || typeof dateString !== 'string') return '';
            const parts = dateString.split('-');
            if (parts.length !== 3) return dateString;
            const [year, month, day] = parts;
            const dateObj = new Date(year, month - 1, day);
            const weekday = dateObj.toLocaleDateString('pt-BR', { weekday: 'long' });
            return `${weekday.charAt(0).toUpperCase() + weekday.slice(1)}, ${day}/${month}/${year}`;
        }

        window.archiveDay = async function(dateKey, itemsJson) {
            const items = JSON.parse(decodeURIComponent(itemsJson));
            for (const item of items) {
                await updateDoc(doc(db, "todos", item.id), { archived: true });
            }
        }

        window.archiveTbcGroup = async function() {
            for (const item of tbcItemsCache) {
                await updateDoc(doc(db, "todos", item.id), { archived: true });
            }
        }

        onSnapshot(query(collection(db, "todos")), (snapshot) => {
            const container = document.getElementById('todos-by-date-container');
            const urgentList = document.getElementById('urgent-list');
            const urgentBadge = document.getElementById('urgent-badge');
            
            container.innerHTML = '';
            urgentList.innerHTML = '';
            tbcItemsCache = [];

            let urgentCount = 0;
            const activeGrouped = {};

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;

                if (!data.archived) {
                    if (data.isTbc) {
                        tbcItemsCache.push({ id, ...data });
                    } else {
                        const dateKey = data.dueDate || todayStr;
                        if (!activeGrouped[dateKey]) activeGrouped[dateKey] = [];
                        activeGrouped[dateKey].push({ id, ...data });
                    }

                    if (data.isUrgent && !data.completed) {
                        urgentCount++;
                        const uLi = document.createElement('li');
                        uLi.className = "flex items-center justify-between p-2 bg-[#261015] rounded border border-rose-800/60 text-sm";
                        uLi.innerHTML = `
                            <div class="flex items-center gap-2 truncate">
                                <input type="checkbox" onchange="toggleTodo('${id}', true)" class="rounded bg-[#1A1A1A] border-rose-600 text-rose-600">
                                <span class="text-rose-200 font-medium truncate">${data.text}</span>
                                <span class="text-[10px] px-1.5 py-0.5 rounded border border-rose-700 bg-rose-950 text-rose-300">${data.category}</span>
                            </div>
                            <span class="text-xs text-rose-400/80">${data.isTbc ? 'TBC' : data.dueDate}</span>
                        `;
                        urgentList.appendChild(uLi);
                    }
                }
            });

            urgentBadge.innerText = urgentCount;
            if (urgentCount === 0) {
                urgentList.innerHTML = `<p class="text-xs text-rose-300/60 italic">Nenhuma tarefa urgente pendente.</p>`;
            }

            const hasActiveDates = Object.keys(activeGrouped).length > 0;
            const hasTbc = tbcItemsCache.length > 0;

            if (!hasActiveDates && !hasTbc) {
                container.innerHTML = `<p class="text-neutral-400 italic col-span-full">Nenhuma tarefa ativa agendada.</p>`;
            } else {
                Object.keys(activeGrouped).sort().forEach(dateKey => {
                    const dayCard = document.createElement('div');
                    dayCard.className = "p-4 rounded-xl shadow-lg border border-[#502064] self-start";
                    dayCard.style.backgroundColor = "#262626";

                    const isToday = dateKey === todayStr;
                    const headerColor = isToday ? "text-[#F48FB1]" : "text-[#D8B4D9]";
                    const badgeTag = isToday ? `<span class="text-xs bg-[#6B0F1A] text-white px-2 py-0.5 rounded ml-2 font-sans">Hoje</span>` : '';
                    const encodedItems = encodeURIComponent(JSON.stringify(activeGrouped[dateKey]));

                    dayCard.innerHTML = `
                        <div class="border-b border-[#6B3A7E] pb-2 mb-3 flex items-center justify-between">
                            <h3 class="font-title text-xl sm:text-2xl ${headerColor} flex items-center">
                                <span>${formatDateHeader(dateKey)}</span>
                                ${badgeTag}
                            </h3>
                            <button onclick="archiveDay('${dateKey}', '${encodedItems}')" title="Arquivar este dia" class="text-xs text-[#D8B4D9]/60 hover:text-[#F48FB1] transition"><i class="fa-solid fa-box-archive"></i> Arquivar</button>
                        </div>
                        <ul class="space-y-2" id="list-${dateKey}"></ul>
                    `;

                    container.appendChild(dayCard);
                    const listEl = dayCard.querySelector(`#list-${dateKey}`);

                    activeGrouped[dateKey].forEach(item => {
                        const li = document.createElement('li');
                        li.className = "flex items-center justify-between p-2.5 bg-[#1A1A1A] rounded border border-[#6B3A7E]/50 text-sm";
                        const categoryColors = item.category === 'CaZinha' ? 'text-amber-300 border-amber-900' :
                                               item.category === 'Aulas' ? 'text-cyan-300 border-cyan-900' : 'text-pink-300 border-pink-900';
                        const safeText = item.text.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                        li.innerHTML = `
                            <div class="flex items-center gap-2 flex-grow overflow-hidden">
                                <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleTodo('${item.id}', ${!item.completed})" class="rounded bg-[#262626] border-[#6B3A7E] text-[#6B0F1A] focus:ring-[#F48FB1]">
                                <span class="${item.completed ? 'line-through text-neutral-500' : 'text-[#D8B4D9]'} truncate">
                                    ${item.isUrgent ? '🚨 ' : ''}${item.text}
                                </span>
                            </div>
                            <div class="flex items-center gap-1.5 ml-2">
                                <span class="text-[10px] px-1.5 py-0.5 border rounded ${categoryColors}">${item.category}</span>
                                <button onclick="startEditTodo('${item.id}', '${safeText}', '${item.category}', '', ${item.isUrgent || false}, false)" class="text-neutral-500 hover:text-[#F48FB1] transition"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteTodo('${item.id}')" class="text-neutral-500 hover:text-rose-400 transition"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        `;
                        listEl.appendChild(li);
                    });
                });

                if (hasTbc) {
                    const tbcCard = document.createElement('div');
                    tbcCard.className = "p-4 rounded-xl shadow-lg border border-[#502064] self-start";
                    tbcCard.style.backgroundColor = "#262626";

                    tbcCard.innerHTML = `
                        <div class="border-b border-[#6B3A7E] pb-2 mb-3 flex items-center justify-between">
                            <h3 class="font-title text-xl sm:text-2xl text-[#F48FB1] flex items-center gap-2">
                                <i class="fa-regular fa-clock text-sm"></i> To Be Confirmed
                            </h3>
                            <button onclick="archiveTbcGroup()" title="Arquivar grupo TBC" class="text-xs text-[#D8B4D9]/60 hover:text-[#F48FB1] transition"><i class="fa-solid fa-box-archive"></i> Arquivar</button>
                        </div>
                        <ul class="space-y-2" id="tbc-list"></ul>
                    `;

                    container.appendChild(tbcCard);
                    const tbcListEl = tbcCard.querySelector('#tbc-list');

                    tbcItemsCache.forEach(item => {
                        const li = document.createElement('li');
                        li.className = "flex items-center justify-between p-2.5 bg-[#1A1A1A] rounded border border-[#6B3A7E]/50 text-sm";
                        const categoryColors = item.category === 'CaZinha' ? 'text-amber-300 border-amber-900' :
                                               item.category === 'Aulas' ? 'text-cyan-300 border-cyan-900' : 'text-pink-300 border-pink-900';
                        const safeText = item.text.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                        li.innerHTML = `
                            <div class="flex items-center gap-2 flex-grow overflow-hidden">
                                <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleTodo('${item.id}', ${!item.completed})" class="rounded bg-[#262626] border-[#6B3A7E] text-[#6B0F1A] focus:ring-[#F48FB1]">
                                <span class="${item.completed ? 'line-through text-neutral-500' : 'text-[#D8B4D9]'} truncate">
                                    ${item.isUrgent ? '🚨 ' : ''}${item.text}
                                </span>
                            </div>
                            <div class="flex items-center gap-1.5 ml-2">
                                <span class="text-[10px] px-1.5 py-0.5 border rounded ${categoryColors}">${item.category}</span>
                                <button onclick="startEditTodo('${item.id}', '${safeText}', '${item.category}', '', ${item.isUrgent || false}, true)" class="text-neutral-500 hover:text-[#F48FB1] transition"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteTodo('${item.id}')" class="text-neutral-500 hover:text-rose-400 transition"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        `;
                        tbcListEl.appendChild(li);
                    });
                }
            }
        });

        window.toggleTodo = async (id, status) => { await updateDoc(doc(db, "todos", id), { completed: status }); }
        window.deleteTodo = async (id) => { await deleteDoc(doc(db, "todos", id)); }
    </script>
</body>
</html>
