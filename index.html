<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel Pessoal & Trabalho</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Fonte Harlow Solid via CDN -->
    <link href="https://fonts.cdnfonts.com/css/harlow-solid-italic" rel="stylesheet">
    <style>
        .font-title {
            font-family: 'Harlow Solid Italic', 'Harlow Solid LET', cursive, sans-serif;
        }
        body {
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            background-color: #1A1A1A;
            color: #D8B4D9;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header style="background-color: #502064;" class="text-white shadow-md border-b border-[#6B3A7E]">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-4xl font-title tracking-wide text-[#F48FB1] flex items-center gap-2">
                Planner & Agenda
            </h1>
            <div id="sync-status" class="text-xs bg-[#6B0F1A] text-[#D8B4D9] px-3 py-1 rounded-full mt-2 sm:mt-0 flex items-center gap-1 border border-[#F48FB1]/30">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" id="status-dot"></span>
                <span id="status-text">Sincronizado na Nuvem</span>
            </div>
        </div>
        <!-- Abas de Navegação -->
        <div class="max-w-6xl mx-auto px-4 flex gap-4 border-b border-[#6B3A7E] overflow-x-auto">
            <button onclick="switchTab('todo')" id="btn-todo" class="tab-btn px-4 py-2 font-medium border-b-2 border-[#F48FB1] text-[#F48FB1] transition">To-Do List</button>
            <button onclick="switchTab('notes')" id="btn-notes" class="tab-btn px-4 py-2 font-medium text-[#D8B4D9]/70 hover:text-white transition">Bloco de Notas</button>
            <button onclick="switchTab('agenda')" id="btn-agenda" class="tab-btn px-4 py-2 font-medium text-[#D8B4D9]/70 hover:text-white transition">Google Agenda</button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- ABA 1: TO-DO LIST -->
        <div id="tab-todo" class="tab-content space-y-6">
            <!-- Formulário de Adicionar/Editar Tarefa -->
            <div style="background-color: #262626;" class="p-5 rounded-xl shadow-lg border border-[#6B3A7E]/40 space-y-3">
                <div class="flex justify-between items-center">
                    <h2 id="form-title" class="text-xl font-title text-[#F48FB1] flex items-center gap-2">
                        <i class="fa-solid fa-list-check"></i> Adicionar Nova Tarefa
                    </h2>
                    <button id="cancel-edit-btn" onclick="cancelEdit()" class="hidden text-xs text-rose-400 hover:underline">Cancelar Edição</button>
                </div>
                
                <form id="todo-form" class="flex flex-col gap-3">
                    <input type="hidden" id="editing-id" value="">
                    
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="todo-text" placeholder="O que precisa ser feito?" required class="flex-grow px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                        
                        <select id="todo-category" class="px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                            <option value="Pessoal">Pessoal</option>
                            <option value="CaZinha">CaZinha</option>
                            <option value="Aulas">Aulas</option>
                        </select>

                        <input type="date" id="todo-date" required class="px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                    </div>

                    <div class="flex items-center justify-between pt-1">
                        <label class="flex items-center gap-2 cursor-pointer text-sm text-rose-400 font-medium">
                            <input type="checkbox" id="todo-urgent" class="rounded bg-[#1A1A1A] border-rose-600 text-rose-600 focus:ring-rose-500">
                            <span>Marcar como Urgente 🚨</span>
                        </label>

                        <button type="submit" id="submit-btn" style="background-color: #6B0F1A;" class="hover:bg-[#801320] text-white px-6 py-2 rounded-lg font-medium transition border border-[#F48FB1]/30">
                            Adicionar Tarefa
                        </button>
                    </div>
                </form>
            </div>

            <!-- SEÇÃO DE TAREFAS URGENTES (EXPANSÍVEL / RETRÁTIL) -->
            <div style="background-color: #33131A;" class="rounded-xl shadow-lg border border-rose-900/60 overflow-hidden">
                <button onclick="toggleUrgentSection()" class="w-full p-4 flex items-center justify-between text-left hover:bg-rose-950/40 transition">
                    <div class="flex items-center gap-2">
                        <span class="text-rose-400 font-title text-xl">🚨 Tarefas Urgentes</span>
                        <span id="urgent-badge" class="text-xs bg-rose-900 text-rose-200 px-2 py-0.5 rounded-full border border-rose-700">0</span>
                    </div>
                    <i id="urgent-toggle-icon" class="fa-solid fa-chevron-down text-rose-400 transition-transform"></i>
                </button>
                <div id="urgent-section-content" class="hidden p-4 border-t border-rose-900/40 space-y-2">
                    <ul id="urgent-list" class="space-y-2"></ul>
                </div>
            </div>

            <!-- TAREFAS AGRUPADAS POR DATA -->
            <div id="todos-by-date-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-neutral-400 italic col-span-full">Carregando tarefas...</p>
            </div>
        </div>

        <!-- ABA 2: BLOCO DE NOTAS -->
        <div id="tab-notes" class="tab-content hidden space-y-6">
            <div style="background-color: #262626;" class="p-5 rounded-xl shadow-lg border border-[#6B3A7E]/40">
                <h2 class="text-xl font-title text-[#F48FB1] mb-3 flex items-center gap-2"><i class="fa-solid fa-note-sticky"></i> Criar / Editar Nota</h2>
                <form id="note-form" class="space-y-3">
                    <input type="text" id="note-title" placeholder="Título da Nota" required class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                    <textarea id="note-body" rows="4" placeholder="Escreva sua nota aqui..." required class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]"></textarea>
                    <button type="submit" style="background-color: #6B0F1A;" class="hover:bg-[#801320] text-white px-5 py-2 rounded-lg font-medium transition border border-[#F48FB1]/30">Salvar Nota</button>
                </form>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="notes-grid"></div>
        </div>

        <!-- ABA 3: GOOGLE AGENDA -->
        <div id="tab-agenda" class="tab-content hidden space-y-6">
            <div style="background-color: #262626;" class="p-5 rounded-xl shadow-lg border border-[#6B3A7E]/40 space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3 border-b border-[#6B3A7E] pb-3">
                    <h2 class="text-xl font-title text-[#F48FB1] flex items-center gap-2"><i class="fa-solid fa-calendar-days"></i> Minha Agenda do Google</h2>
                    <a href="https://calendar.google.com" target="_blank" style="background-color: #6B0F1A;" class="text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-[#801320] transition border border-[#F48FB1]/30 flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Novo Evento no Google Agenda
                    </a>
                </div>
                <div class="w-full h-[600px] rounded-lg overflow-hidden border border-[#6B3A7E]">
                    <iframe src="https://calendar.google.com/calendar/embed?src=nathalialex12%40gmail.com&ctz=America%2FSao_Paulo&hl=pt_BR" style="border: 0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
                </div>
            </div>
        </div>

    </main>

    <!-- Firebase SDKs via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk3kW6ae9nceSgvRWJrfm5ka_Kbjor0mk",
            authDomain: "painelpessoal-ab165.firebaseapp.com",
            projectId: "painelpessoal-ab165",
            storageBucket: "painelpessoal-ab165.firebasestorage.app",
            messagingSenderId: "113043267624",
            appId: "1:113043267624:web:b2d40daac28c3a55a4951d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Define data atual
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('todo-date').value = todayStr;

        // Alternar seção de urgentes
        window.toggleUrgentSection = function() {
            const content = document.getElementById('urgent-section-content');
            const icon = document.getElementById('urgent-toggle-icon');
            content.classList.toggle('hidden');
            icon.classList.toggle('rotate-180');
        }

        // Alternar abas
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('border-b-2', 'border-[#F48FB1]', 'text-[#F48FB1]');
                el.classList.add('text-[#D8B4D9]/70');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`btn-${tabName}`);
            activeBtn.classList.add('border-b-2', 'border-[#F48FB1]', 'text-[#F48FB1]');
            activeBtn.classList.remove('text-[#D8B4D9]/70');
        }

        // Submeter formulário de Tarefa (Criar ou Editar)
        const todoForm = document.getElementById('todo-form');
        todoForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('todo-text').value;
            const category = document.getElementById('todo-category').value;
            const dueDate = document.getElementById('todo-date').value;
            const isUrgent = document.getElementById('todo-urgent').checked;
            const editId = document.getElementById('editing-id').value;

            try {
                if (editId) {
                    await updateDoc(doc(db, "todos", editId), {
                        text, category, dueDate, isUrgent
                    });
                    cancelEdit();
                } else {
                    await addDoc(collection(db, "todos"), { 
                        text, category, dueDate, isUrgent, completed: false, createdAt: Date.now() 
                    });
                    todoForm.reset();
                    document.getElementById('todo-date').value = todayStr;
                }
            } catch (err) { console.error("Erro ao salvar tarefa:", err); }
        });

        // Preparar edição de tarefa
        window.startEditTodo = function(id, text, category, dueDate, isUrgent) {
            document.getElementById('editing-id').value = id;
            document.getElementById('todo-text').value = text;
            document.getElementById('todo-category').value = category;
            document.getElementById('todo-date').value = dueDate;
            document.getElementById('todo-urgent').checked = isUrgent;

            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> Editar Tarefa`;
            document.getElementById('submit-btn').innerText = "Atualizar Tarefa";
            document.getElementById('cancel-edit-btn').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.cancelEdit = function() {
            document.getElementById('editing-id').value = "";
            todoForm.reset();
            document.getElementById('todo-date').value = todayStr;
            document.getElementById('form-title').innerHTML = `<i class="fa-solid fa-list-check"></i> Adicionar Nova Tarefa`;
            document.getElementById('submit-btn').innerText = "Adicionar Tarefa";
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        function formatDateHeader(dateString) {
            const [year, month, day] = dateString.split('-');
            const dateObj = new Date(year, month - 1, day);
            const weekday = dateObj.toLocaleDateString('pt-BR', { weekday: 'long' });
            return `${weekday.charAt(0).toUpperCase() + weekday.slice(1)}, ${day}/${month}/${year}`;
        }

        // Renderizar To-Do List e Urgentes
        onSnapshot(query(collection(db, "todos"), orderBy("dueDate", "asc")), (snapshot) => {
            const container = document.getElementById('todos-by-date-container');
            const urgentList = document.getElementById('urgent-list');
            const urgentBadge = document.getElementById('urgent-badge');
            
            container.innerHTML = '';
            urgentList.innerHTML = '';

            let urgentCount = 0;

            if (snapshot.empty) {
                container.innerHTML = `<p class="text-neutral-400 italic col-span-full">Nenhuma tarefa agendada.</p>`;
                urgentBadge.innerText = '0';
                return;
            }

            const grouped = {};

            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const id = docSnap.id;
                const dateKey = data.dueDate || todayStr;

                if (!grouped[dateKey]) grouped[dateKey] = [];
                grouped[dateKey].push({ id, ...data });

                // Se for urgente e não concluída, insere na lista de urgentes
                if (data.isUrgent && !data.completed) {
                    urgentCount++;
                    const uLi = document.createElement('li');
                    uLi.className = "flex items-center justify-between p-2 bg-[#261015] rounded border border-rose-800/60 text-sm";
                    uLi.innerHTML = `
                        <div class="flex items-center gap-2 truncate">
                            <input type="checkbox" onchange="toggleTodo('${id}', true)" class="rounded bg-[#1A1A1A] border-rose-600 text-rose-600">
                            <span class="text-rose-200 font-medium truncate">${data.text}</span>
                            <span class="text-[10px] px-1.5 py-0.5 rounded border border-rose-700 bg-rose-950 text-rose-300">${data.category}</span>
                        </div>
                        <span class="text-xs text-rose-400/80">${data.dueDate}</span>
                    `;
                    urgentList.appendChild(uLi);
                }
            });

            urgentBadge.innerText = urgentCount;
            if (urgentCount === 0) {
                urgentList.innerHTML = `<p class="text-xs text-rose-300/60 italic">Nenhuma tarefa urgente pendente.</p>`;
            }

            // Renderizar cards por data
            Object.keys(grouped).sort().forEach(dateKey => {
                const dayCard = document.createElement('div');
                dayCard.className = "p-4 rounded-xl shadow-lg border border-[#502064]";
                dayCard.style.backgroundColor = "#262626";

                const isToday = dateKey === todayStr;
                const headerColor = isToday ? "text-[#F48FB1]" : "text-[#D8B4D9]";
                const badgeTag = isToday ? `<span class="text-xs bg-[#6B0F1A] text-white px-2 py-0.5 rounded ml-2">Hoje</span>` : '';

                dayCard.innerHTML = `
                    <h3 class="font-title text-lg ${headerColor} border-b border-[#6B3A7E] pb-2 mb-3 flex items-center justify-between">
                        <span>${formatDateHeader(dateKey)}</span>
                        ${badgeTag}
                    </h3>
                    <ul class="space-y-2" id="list-${dateKey}"></ul>
                `;

                container.appendChild(dayCard);
                const listEl = dayCard.querySelector(`#list-${dateKey}`);

                grouped[dateKey].forEach(item => {
                    const li = document.createElement('li');
                    li.className = "flex items-center justify-between p-2.5 bg-[#1A1A1A] rounded border border-[#6B3A7E]/50 text-sm";

                    const categoryColors = item.category === 'CaZinha' ? 'text-amber-300 border-amber-900' :
                                           item.category === 'Aulas' ? 'text-cyan-300 border-cyan-900' : 'text-pink-300 border-pink-900';

                    const safeText = item.text.replace(/'/g, "\\'").replace(/"/g, '&quot;');

                    li.innerHTML = `
                        <div class="flex items-center gap-2 flex-grow overflow-hidden">
                            <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleTodo('${item.id}', ${!item.completed})" class="rounded bg-[#262626] border-[#6B3A7E] text-[#6B0F1A] focus:ring-[#F48FB1]">
                            <span class="${item.completed ? 'line-through text-neutral-500' : 'text-[#D8B4D9]'} truncate">
                                ${item.isUrgent ? '🚨 ' : ''}${item.text}
                            </span>
                        </div>
                        <div class="flex items-center gap-1.5 ml-2">
                            <span class="text-[10px] px-1.5 py-0.5 border rounded ${categoryColors}">${item.category}</span>
                            <button onclick="startEditTodo('${item.id}', '${safeText}', '${item.category}', '${item.dueDate}', ${item.isUrgent || false})" class="text-neutral-500 hover:text-[#F48FB1] transition"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteTodo('${item.id}')" class="text-neutral-500 hover:text-rose-400 transition"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    listEl.appendChild(li);
                });
            });
        });

        window.toggleTodo = async (id, status) => {
            await updateDoc(doc(db, "todos", id), { completed: status });
        }
        window.deleteTodo = async (id) => {
            await deleteDoc(doc(db, "todos", id));
        }

        // Bloco de Notas
        const noteForm = document.getElementById('note-form');
        noteForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('note-title').value;
            const body = document.getElementById('note-body').value;
            try {
                await addDoc(collection(db, "notes"), { title, body, createdAt: Date.now() });
                noteForm.reset();
            } catch (err) { console.error("Erro ao salvar nota:", err); }
        });

        onSnapshot(query(collection(db, "notes"), orderBy("createdAt", "desc")), (snapshot) => {
            const grid = document.getElementById('notes-grid');
            grid.innerHTML = '';
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const card = document.createElement('div');
                card.className = "p-4 rounded-xl shadow-md border border-[#6B3A7E] flex flex-col justify-between";
                card.style.backgroundColor = "#221926";
                card.innerHTML = `
                    <div>
                        <h3 class="font-title text-xl text-[#F48FB1] mb-1">${data.title}</h3>
                        <p class="text-sm text-[#D8B4D9] whitespace-pre-wrap">${data.body}</p>
                    </div>
                    <div class="mt-4 flex justify-end">
                        <button onclick="deleteNote('${docSnap.id}')" class="text-[#D8B4D9]/60 hover:text-rose-400 text-xs transition flex items-center gap-1"><i class="fa-solid fa-trash"></i> Excluir</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        });

        window.deleteNote = async (id) => {
            await deleteDoc(doc(db, "notes", id));
        }
    </script>
</body>
</html>
