<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Agenda | Painel Pessoal</title>

    <!-- 🌙 FAVICON GÓTICO -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🌸 GOOGLE FONT: Cinzel Decorative -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
        .font-title {
            font-family: 'Cinzel Decorative', serif;
        }
        body {
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            background-color: #1A1A1A !important;
            color: #D8B4D9;
        }
    </style>
</head>
<body style="background-color: #1A1A1A;" class="min-h-screen flex flex-col">

    <!-- Header -->
    <header style="background-color: #502064;" class="text-white shadow-md border-b border-[#6B3A7E]">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-3xl sm:text-4xl font-title tracking-wide text-[#F48FB1] flex items-center gap-2">
                Meu Painel Integrado
            </h1>
            <div id="sync-status" class="text-xs bg-[#6B0F1A] text-[#D8B4D9] px-3 py-1 rounded-full mt-2 sm:mt-0 flex items-center gap-1 border border-[#F48FB1]/30">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Sincronizado na Nuvem</span>
            </div>
        </div>

        <!-- ABAS DE NAVEGAÇÃO DINÂMICAS AUTOMÁTICAS -->
        <div id="nav-tabs-container" class="max-w-6xl mx-auto px-4 flex flex-wrap gap-2 sm:gap-4 border-b border-[#6B3A7E] py-2">
            <!-- Renderizado dinamicamente pelo nav.js -->
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- ABA GOOGLE AGENDA -->
        <div class="space-y-6">
            <div style="background-color: #262626;" class="p-5 rounded-xl shadow-lg border border-[#6B3A7E]/40 space-y-4">
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3 border-b border-[#6B3A7E] pb-3">
                    <h2 class="text-2xl font-title text-[#F48FB1] flex items-center gap-2">
                        <i class="fa-solid fa-calendar-days text-base"></i> Minha Agenda do Google
                    </h2>
                    <a href="https://calendar.google.com" target="_blank" style="background-color: #6B0F1A;" class="text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-[#801320] transition border border-[#F48FB1]/30 flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Novo Evento no Google Agenda
                    </a>
                </div>
                <div class="w-full h-[600px] rounded-lg overflow-hidden border border-[#6B3A7E]">
                    <iframe src="https://calendar.google.com/calendar/embed?src=nathalialex12%40gmail.com&ctz=America%2FSao_Paulo&hl=pt_BR" style="border: 0" width="100%" height="100%" frameborder="0" scrolling="no"></iframe>
                </div>
            </div>
        </div>

    </main>

    <!-- Script da Navegação Dinâmica -->
    <script src="nav.js"></script>
</body>
</html>
