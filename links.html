<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links Úteis | Painel Pessoal</title>

    <!-- 🌙 FAVICON GÓTICO -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🌸 GOOGLE FONT: Cinzel Decorative -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
        .font-title {
            font-family: 'Cinzel Decorative', serif;
        }
        body {
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            background-color: #1A1A1A !important;
            color: #D8B4D9;
        }
    </style>
</head>
<body style="background-color: #1A1A1A;" class="min-h-screen flex flex-col">

    <!-- Header -->
    <header style="background-color: #502064;" class="text-white shadow-md border-b border-[#6B3A7E]">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-3xl sm:text-4xl font-title tracking-wide text-[#F48FB1] flex items-center gap-2">
                Meu Painel Integrado
            </h1>
            <div id="sync-status" class="text-xs bg-[#6B0F1A] text-[#D8B4D9] px-3 py-1 rounded-full mt-2 sm:mt-0 flex items-center gap-1 border border-[#F48FB1]/30">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Sincronizado na Nuvem</span>
            </div>
        </div>

        <!-- ABAS DE NAVEGAÇÃO DINÂMICAS AUTOMÁTICAS -->
        <div id="nav-tabs-container" class="max-w-6xl mx-auto px-4 flex flex-wrap gap-2 sm:gap-4 border-b border-[#6B3A7E] py-2">
            <!-- Renderizado dinamicamente pelo nav.js -->
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- ABA LINKS ÚTEIS -->
        <div class="space-y-6">
            <div style="background-color: #262626;" class="p-5 rounded-xl shadow-lg border border-[#6B3A7E]/40 space-y-3">
                <h2 class="text-2xl font-title text-[#F48FB1] flex items-center gap-2">
                    <i class="fa-solid fa-link text-base"></i> Adicionar Novo Link Útil
                </h2>
                
                <form id="link-form" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <input type="text" id="link-title" placeholder="Título (ex: Canva, Drive, Notion)" required class="px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                    <input type="url" id="link-url" placeholder="URL (https://...)" required class="px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                    <select id="link-category" class="px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                        <option value="Trabalho">Trabalho</option>
                        <option value="CaZinha">CaZinha</option>
                        <option value="Aulas">Aulas</option>
                        <option value="Pessoal">Pessoal</option>
                        <option value="Outros">Outros</option>
                    </select>
                    <input type="text" id="link-desc" placeholder="Descrição curta (opcional)" class="px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                    
                    <button type="submit" style="background-color: #6B0F1A;" class="sm:col-span-2 lg:col-span-4 hover:bg-[#801320] text-white px-6 py-2 rounded-lg font-medium transition border border-[#F48FB1]/30">
                        Salvar Link
                    </button>
                </form>
            </div>

            <div id="links-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <p class="text-neutral-400 italic col-span-full">Carregando links...</p>
            </div>
        </div>

    </main>

    <!-- Script da Navegação Dinâmica -->
    <script src="nav.js"></script>

    <!-- Firebase SDKs via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk3kW6ae9nceSgvRWJrfm5ka_Kbjor0mk",
            authDomain: "painelpessoal-ab165.firebaseapp.com",
            projectId: "painelpessoal-ab165",
            storageBucket: "painelpessoal-ab165.firebasestorage.app",
            messagingSenderId: "113043267624",
            appId: "1:113043267624:web:b2d40daac28c3a55a4951d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const linkForm = document.getElementById('link-form');
        if (linkForm) {
            linkForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const title = document.getElementById('link-title').value;
                let url = document.getElementById('link-url').value;
                const category = document.getElementById('link-category').value;
                const desc = document.getElementById('link-desc').value;

                if (!url.startsWith('http://') && !url.startsWith('https://')) {
                    url = 'https://' + url;
                }

                try {
                    await addDoc(collection(db, "links"), { title, url, category, desc, createdAt: Date.now() });
                    linkForm.reset();
                } catch (err) { console.error("Erro ao salvar link:", err); }
            });
        }

        onSnapshot(query(collection(db, "links"), orderBy("createdAt", "desc")), (snapshot) => {
            const container = document.getElementById('links-container');
            if (!container) return;

            container.innerHTML = '';

            if (snapshot.empty) {
                container.innerHTML = `<p class="text-neutral-400 italic col-span-full">Nenhum link salvo ainda.</p>`;
                return;
            }

            const grouped = {};
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const cat = data.category || 'Outros';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push({ id: docSnap.id, ...data });
            });

            Object.keys(grouped).sort().forEach(catKey => {
                const catBlock = document.createElement('div');
                catBlock.className = "p-4 rounded-xl shadow-lg border border-[#502064]";
                catBlock.style.backgroundColor = "#262626";

                catBlock.innerHTML = `
                    <h3 class="font-title text-xl sm:text-2xl text-[#F48FB1] border-b border-[#6B3A7E] pb-2 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-bookmark text-xs"></i> ${catKey}
                    </h3>
                    <div class="space-y-2.5" id="links-group-${catKey}"></div>
                `;

                container.appendChild(catBlock);
                const listEl = catBlock.querySelector(`#links-group-${catKey}`);

                grouped[catKey].forEach(link => {
                    const item = document.createElement('div');
                    item.className = "p-3 bg-[#1A1A1A] rounded-lg border border-[#6B3A7E]/50 flex items-center justify-between gap-3 hover:border-[#F48FB1]/50 transition";
                    
                    item.innerHTML = `
                        <div class="overflow-hidden flex-grow">
                            <a href="${link.url}" target="_blank" class="font-medium text-[#F48FB1] hover:underline flex items-center gap-1.5 text-sm">
                                <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i> ${link.title}
                            </a>
                            ${link.desc ? `<p class="text-xs text-[#D8B4D9]/70 truncate mt-0.5">${link.desc}</p>` : ''}
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="navigator.clipboard.writeText('${link.url}')" title="Copiar URL" class="text-neutral-500 hover:text-[#D8B4D9] text-xs transition"><i class="fa-solid fa-copy"></i></button>
                            <button onclick="deleteLink('${link.id}')" title="Excluir Link" class="text-neutral-500 hover:text-rose-400 text-xs transition"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    `;
                    listEl.appendChild(item);
                });
            });
        });

        window.deleteLink = async (id) => { 
            if (confirm("Deseja realmente excluir este link?")) {
                await deleteDoc(doc(db, "links", id)); 
            }
        }
    </script>
</body>
</html>
