<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Chamada & Presença - Painel Integrado</title>

    <!-- 🌙 FAVICON GÓTICO -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌙</text></svg>">

    <!-- Script para lembrar e voltar à última página aberta ao reabrir o site -->
    <script>
        (function() {
            const currentPath = window.location.pathname.split('/').pop() || 'chamada.html';
            localStorage.setItem('lastActivePage', currentPath);
        })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🌸 GOOGLE FONT: Cinzel Decorative -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
    <style>
        .font-title {
            font-family: 'Cinzel Decorative', serif;
        }
        body {
            font-family: 'Century Gothic', CenturyGothic, AppleGothic, sans-serif;
            background-color: #1A1A1A !important;
            color: #D8B4D9;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
    </style>
</head>
<body style="background-color: #1A1A1A;" class="min-h-screen flex flex-col">

    <!-- Header -->
    <header style="background-color: #502064;" class="text-white shadow-md border-b border-[#6B3A7E]">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-2xl sm:text-3xl font-title tracking-wide text-[#F48FB1] flex items-center gap-2">
                Controle de Chamada & Presença
            </h1>
            <div id="sync-status" class="text-xs bg-[#6B0F1A] text-[#D8B4D9] px-3 py-1 rounded-full mt-2 sm:mt-0 flex items-center gap-1 border border-[#F48FB1]/30">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>Sincronizado na Nuvem</span>
            </div>
        </div>

        <!-- ABAS DE NAVEGAÇÃO DINÂMICAS AUTOMÁTICAS -->
        <div id="nav-tabs-container" class="max-w-6xl mx-auto px-4 flex flex-wrap gap-2 sm:gap-4 border-b border-[#6B3A7E] py-2">
            <!-- Renderizado dinamicamente pelo nav.js -->
        </div>
    </header>

    <!-- Main Container: Chamada -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Seleção de Aluno & Data da Aula -->
        <div style="background-color: #262626;" class="p-5 rounded-xl shadow-lg border border-[#6B3A7E]/40 space-y-4">
            <h2 class="text-xl sm:text-2xl font-title text-[#F48FB1] flex items-center gap-2">
                <i class="fa-solid fa-clipboard-user text-base"></i> Registar Presença em Aula
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="text-xs text-[#D8B4D9]/80 mb-1 block">Selecionar Aluno(a)</label>
                    <select id="select-aluno" class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                        <option value="">Carregando alunos...</option>
                    </select>
                </div>

                <div>
                    <label class="text-xs text-[#D8B4D9]/80 mb-1 block">Data da Aula</label>
                    <input type="date" id="input-data-aula" class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                </div>

                <div>
                    <label class="text-xs text-[#D8B4D9]/80 mb-1 block">Status de Presença</label>
                    <select id="select-status-aula" class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
                        <option value="Presente 🟢">Presente 🟢</option>
                        <option value="Falta Justificada 🟡">Falta Justificada 🟡</option>
                        <option value="Falta Não Justificada 🔴">Falta Não Justificada 🔴</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="text-xs text-[#D8B4D9]/80 mb-1 block">Anotações da Aula (Tópicos Vistos / TAREFA)</label>
                <input type="text" id="input-notas-aula" placeholder="ex: Present Perfect, Student's Book pág. 45" class="w-full px-3 py-2 bg-[#1A1A1A] border border-[#6B3A7E] text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F48FB1]">
            </div>

            <div class="flex justify-end">
                <button onclick="salvarPresenca()" style="background-color: #6B0F1A;" class="hover:bg-[#801320] text-white px-6 py-2 rounded-lg font-medium transition border border-[#F48FB1]/30">
                    Registar Presença
                </button>
            </div>
        </div>

        <!-- Histórico de Presenças do Aluno Selecionado -->
        <div style="background-color: #262626;" class="p-5 rounded-xl shadow-lg border border-[#6B3A7E]/40 space-y-4">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-[#6B3A7E] pb-2 gap-2">
                <h3 class="text-lg sm:text-xl font-title text-[#F48FB1] flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-sm"></i> Histórico de Chamadas
                </h3>
                <span id="contador-aulas" class="text-xs bg-[#502064] text-[#D8B4D9] px-2.5 py-1 rounded-full border border-[#6B3A7E]">Total de Aulas Registadas: 0</span>
            </div>

            <div id="historico-container" class="space-y-3">
                <p class="text-neutral-400 italic">Selecione um aluno acima ou aguarde o carregamento...</p>
            </div>
        </div>

    </main>

    <!-- Script da Navegação Dinâmica -->
    <script src="nav.js"></script>

    <!-- Firebase SDKs via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, onSnapshot, query, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCk3kW6ae9nceSgvRWJrfm5ka_Kbjor0mk",
            authDomain: "painelpessoal-ab165.firebaseapp.com",
            projectId: "painelpessoal-ab165",
            storageBucket: "painelpessoal-ab165.firebasestorage.app",
            messagingSenderId: "113043267624",
            appId: "1:113043267624:web:b2d40daac28c3a55a4951d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('input-data-aula').value = todayStr;

        let alunosMap = {};

        // Carregar lista de alunos no select
        onSnapshot(query(collection(db, "alunos")), (snapshot) => {
            const select = document.getElementById('select-aluno');
            const currentSelected = select.value;
            select.innerHTML = '<option value="">Selecione um aluno...</option>';
            alunosMap = {};

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (!data.archived) {
                    alunosMap[docSnap.id] = data;
                    const opt = document.createElement('option');
                    opt.value = docSnap.id;
                    opt.innerText = data.nome || 'Sem Nome';
                    select.appendChild(opt);
                }
            });

            if (currentSelected && alunosMap[currentSelected]) {
                select.value = currentSelected;
            }
            renderHistorico();
        });

        document.getElementById('select-aluno').addEventListener('change', renderHistorico);

        window.salvarPresenca = async function() {
            const alunoId = document.getElementById('select-aluno').value;
            const dataAula = document.getElementById('input-data-aula').value;
            const statusAula = document.getElementById('select-status-aula').value;
            const notasAula = document.getElementById('input-notas-aula').value;

            if (!alunoId) {
                alert("Por favor, selecione um aluno.");
                return;
            }
            if (!dataAula) {
                alert("Por favor, informe a data da aula.");
                return;
            }

            try {
                const alunoRef = doc(db, "alunos", alunoId);
                const alunoSnap = await getDoc(alunoRef);
                if (alunoSnap.exists()) {
                    const data = alunoSnap.data();
                    let aulasPresenca = data.aulasPresenca || [];
                    
                    // Adicionar nova aula
                    aulasPresenca.push({
                        id: Date.now().toString(),
                        dataAula,
                        statusAula,
                        notasAula
                    });

                    await updateDoc(alunoRef, { aulasPresenca });
                    document.getElementById('input-notas-aula').value = '';
                    alert("Presença registada com sucesso!");
                }
            } catch (err) {
                console.error("Erro ao salvar presença:", err);
                alert("Erro ao registar presença.");
            }
        }

        window.removerPresenca = async function(aulaId) {
            const alunoId = document.getElementById('select-aluno').value;
            if (!alunoId) return;

            if (confirm("Deseja realmente excluir este registo de chamada?")) {
                try {
                    const alunoRef = doc(db, "alunos", alunoId);
                    const alunoSnap = await getDoc(alunoRef);
                    if (alunoSnap.exists()) {
                        const data = alunoSnap.data();
                        let aulasPresenca = data.aulasPresenca || [];
                        aulasPresenca = aulasPresenca.filter(a => a.id !== aulaId);

                        await updateDoc(alunoRef, { aulasPresenca });
                    }
                } catch (err) {
                    console.error("Erro ao remover presença:", err);
                }
            }
        }

        function formatDateDisplay(val) {
            if (!val) return '';
            if (typeof val === 'string' && val.includes('-')) {
                const parts = val.split('-');
                if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return String(val);
        }

        function renderHistorico() {
            const alunoId = document.getElementById('select-aluno').value;
            const container = document.getElementById('historico-container');
            const contadorBadge = document.getElementById('contador-aulas');
            
            container.innerHTML = '';

            if (!alunoId || !alunosMap[alunoId]) {
                container.innerHTML = `<p class="text-neutral-400 italic">Selecione um aluno acima para visualizar o histórico de chamadas.</p>`;
                contadorBadge.innerText = `Total de Aulas Registadas: 0`;
                return;
            }

            const aluno = alunosMap[alunoId];
            const aulas = aluno.aulasPresenca || [];

            contadorBadge.innerText = `Total de Aulas Registadas: ${aulas.length}`;

            if (aulas.length === 0) {
                container.innerHTML = `<p class="text-neutral-400 italic">Nenhuma aula registada para este aluno ainda.</p>`;
                return;
            }

            // Ordenar por data decrescente
            aulas.sort((a, b) => b.dataAula.localeCompare(a.dataAula));

            aulas.forEach(aula => {
                const card = document.createElement('div');
                card.className = "p-3 bg-[#1A1A1A] rounded-lg border border-[#6B3A7E]/50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2";
                
                const badgeColor = aula.statusAula.includes('Presente') ? 'bg-[#502064] text-[#F48FB1] border-[#6B3A7E]' :
                                   aula.statusAula.includes('Justificada') ? 'bg-amber-950 text-amber-300 border-amber-800' : 'bg-[#6B0F1A] text-rose-200 border-rose-800';

                card.innerHTML = `
                    <div class="space-y-1">
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-[#F48FB1] text-sm"><i class="fa-solid fa-calendar-day text-xs"></i> ${formatDateDisplay(aula.dataAula)}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded border ${badgeColor}">${aula.statusAula}</span>
                        </div>
                        ${aula.notasAula ? `<p class="text-xs text-[#D8B4D9]/80 italic">📝 ${aula.notasAula}</p>` : ''}
                    </div>
                    <button onclick="removerPresenca('${aula.id}')" title="Excluir Registo" class="text-neutral-500 hover:text-rose-400 text-xs transition">
                        <i class="fa-solid fa-trash"></i> Excluir
                    </button>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
